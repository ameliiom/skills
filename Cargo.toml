[package]
name = "mod-skills"
version = "0.2.2"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The same versions the API already locks: tree files are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
# `kit_local`: set for local builds by horizon-mods/.cargo/config.toml (Kit's source in place).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kit_local)'] }
